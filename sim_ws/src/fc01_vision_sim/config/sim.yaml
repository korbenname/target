fc01_vision_sim:
  ros__parameters:
    # MuJoCo 仿真（飞控侧）：场景、FPV 相机、四旋翼刚体，以及平台状态发布。
    # 制导/巡航状态机在 fc01_mission 里，不在这个包里。

    # 是否关闭 MuJoCo 交互窗口（true = 无窗口运行，适合远程/CI）
    headless: false
    # 320x240 时每帧约 230 kB。640x480 的单帧约 0.9 MB，本机默认 Fast DDS
    # UDP 缓冲下 best-effort 图像会大量丢帧，大部分帧到不了订阅者。
    render_width: 320
    render_height: 240
    render_fps: 30.0
    physics_hz: 200.0
    # 广角 FPV 镜头（垂直 70°，4:3 下水平约 86°）。视场太窄时，飞机在
    # 横滚/刹车瞬态中很容易把近处目标甩出画面。
    camera_fovy_deg: 70.0
    # 地图：一个完整 MJCF 文件（含自身 asset/worldbody），会替换掉默认的
    # 棋盘地面。相对路径依次按当前目录、工作区根目录（target/）查找。
    # 留空 = 使用原来的平坦棋盘地面。
    # RMUC2027 场地范围 x∈[-25.2, 2.84], y∈[-12.98, 3.06]，地面高度约 0–0.5 m。
    map_xml: "RMUC2027/scene_rmuc.xml"

    # 目标 = 地图上自带的绿色指示灯，不再放球。
    # 灯在东侧 ROBOMASTER 基地头部，(0.315, -4.958, 1.373)，灯面朝 -x（西），
    # 尺寸约 5.7 x 5.5 cm。它是 CAD 视觉网格，本身不参与碰撞，所以这里用
    # 一块同位置的隐形竖直面板作为接触代理（target_visible: false 时完全
    # 透明但仍参与碰撞），顶住时接触力是真实的。用面板而不是球体：球体只有
    # 3 cm 半径，飞机贴上去时腹部会“骑”到球的上面，接触法向朝上，机身慢慢
    # 爬高、俯仰角一路涨到 34°；平板法向始终水平，冲撞不会产生抬头/低头力矩。
    # 面板比灯大得多（24 cm 宽、40 cm 高，见 scene.py）：比机身宽，冲撞偏几
    # 厘米也不会擦到侧边；比机身能跳到的高度还高，飞机不会在撞后爬到面板顶
    # 上停住。面板不可见，只影响碰撞。
    target_visible: false
    # 灯的半径（m），用于日志和视觉先验；面板尺寸由 scene.py 的常量决定。
    target_radius: 0.03
    # 地图上绿灯的坐标。fc01_mission 的 mission.yaml 里也有一份同样的先验
    # （制导盲飞和静态冲撞用），两处必须一致。
    target_x: 0.315
    target_y: -4.958
    target_base_z: 1.373
    target_amp_y: 0.0
    target_amp_z: 0.0
    # static：目标固定在 (target_x, target_y, target_base_z)。
    # random：每 target_segment_s 换一个随机航点。
    # sinusoid：旧版 Y/Z 正弦扫掠，频率用 target_freq_hz。
    target_motion: static
    target_segment_s: 2.5
    # 0 = 每次运行都用新的随机轨迹；非零 = 航点序列可复现。
    target_random_seed: 0
    target_freq_hz: 0.15
    # 绿色圆形标记（画在地面）；目标本身已经是绿灯，默认不额外画圆盘，
    # 否则俯视时会和灯一起被识别成两个绿色目标。
    target_marker: false
    target_marker_radius: 0.55
    target_marker_z: 0.003

    # 撞击无人机模型：外观用 STL 简化到 15 万面的 OBJ（MuJoCo 单个 mesh 上限
    # 20 万面，原始 42 万面加载会直接报错），碰撞用 tools/make_hull.py 生成的
    # 凸包。原始 STL 单位是毫米，包围盒 118.8 x 73 x 118.7 mm —— 真机就是
    # 240 g、约 12 cm 见方的 2.5 寸穿越机，所以按 1:1 使用（scale=1），不再
    # 放大到 32 cm。0 表示按旋翼直径自动缩放（仅作兜底）。
    platform_mesh: impact_drone_lod.obj
    platform_mesh_hull: impact_drone_hull.obj
    platform_mesh_scale: 1.0

    # 四旋翼刚体模型（自由关节 + 四个旋翼推力）。240 g、约 110 mm 轴距：
    # 电机在 ±4 cm，单桨最大推力约 2.5 N（推重比约 4.2）。
    platform_mass: 0.24
    arm_length: 0.04
    rotor_max_thrust: 2.5
    rotor_drag_m: 0.01
    motor_tau: 0.04
    # 姿态环：误差按旋转矢量算，torque = I * (-gain*err - damping*omega)。
    # 自然频率 = sqrt(gain)=16.1 rad/s（2.6 Hz），阻尼比
    # = damping / (2*sqrt(gain)) = 0.68。
    attitude_gain: 260.0
    attitude_damping: 22.0
    # 推力方向最大倾角。35° 对应约 6.9 m/s^2 的水平加速度（0.7 g），
    # 2 m/s 的冲撞段（速度环时间常数 0.12 s）需要约 59° 才会饱和，
    # 35° 是正常飞行力矩和稳定性的折中。
    max_tilt_deg: 35.0
    # 顶住目标时（有接触力）的倾角上限：持续顶力只需要约 10°，
    # 收紧到 22° 让机身和镜头更稳。制导侧 push_max_tilt 不再单独存在，
    # 这是飞控侧的安全限幅。
    contact_max_tilt_deg: 22.0
    # 相机安装俯仰角（正值 = 上仰），必须和视觉节点一致。
    camera_pitch_deg: 10.0
    # FPV 相机的“真机感”。机身姿态完全由物理决定，但真实穿越机的镜头
    # 硬固定在振动的机架上，画面会抖 0.1–0.3°；相机传感器也有轻微噪点。
    # 这里只叠加在发布的图像上（不改物理、不改控制），幅度约 0.5 像素，
    # 对识别没有影响。设为 0 可以关掉，回到完全干净的仿真画面。
    camera_shake_deg: 0.15
    camera_noise_lsb: 1.5

    # 起飞点：地图中心 ROBOMASTER 装置上的白色 H 标牌——黑色圆角方牌、
    # 中间一圈红线、正中一个白色 H，牌面朝上。白 H 的 CAD 三角形包围盒
    # x∈[-10.236,-10.058]、y∈[-4.016,-3.838]、z=1.731，所以牌心是
    # (-10.147, -3.927)，牌面高 1.731 m。
    # 飞机悬停在牌面上方：z = 1.731 + 机壳半高 0.0365 + 约 8 mm 余隙。
    platform_start_x: -10.15
    platform_start_y: -3.93
    platform_start_z: 1.775
    # 机头对准东侧绿灯 (0.315, -4.958)：atan2(-1.031, 10.462)。
    platform_yaw_deg: -5.6
    # 白色 H 是地图自带的牌面，不再额外画假的 H 标。
    landing_pad: false

    # ---- 飞控侧接口 ----
    # 240 g 机体的转动惯量（按 11.9 x 11.9 x 7.3 cm 的盒体估算）。
    platform_ixx: 0.0004
    platform_iyy: 0.0004
    platform_izz: 0.0006
    # 速度环一阶时间常数：a_des = (v_cmd - v) / velocity_tau。
    # 0.12 s 让速度指令几乎立刻变成加速度（再靠 max_tilt 限幅）。
    velocity_tau: 0.12
    # 接收 fc01_mission 的机体系 FRD 速度指令（真机飞控订阅的同一话题）。
    apply_vision_control: true
    vision_control_topic: /visioncontrol
    # 航向只以速度指令里的 wz（机体偏航角速度）给出，没有单独的航向角话题。
    # 指令超时：这么久没有新指令就悬停（0 速度），不再执行旧指令。
    command_timeout_s: 0.5
    # engage_mode 只决定“接触是否结束本回合”：push 不结束（要持续顶住），
    # impact/track 第一次接触就切电机。制导模式本身在 fc01_mission 里。
    engage_mode: push
    # 接触后（impact 模式）过多少秒复位飞机；0 = 不复位。
    reset_after_impact_s: 0.0
    reset_out_of_bounds: true
    reset_topic: /sim/reset

    # ---- 平台状态输出（fc01_mission 的输入）----
    platform_pose_topic: /sim/platform_pose
    platform_velocity_topic: /sim/platform_velocity
    platform_angular_velocity_topic: /sim/platform_angular_velocity
    contact_force_topic: /sim/target_contact_force
    impact_topic: /sim/impact
    reset_event_topic: /sim/reset_event
    state_publish_hz: 100.0
    publish_ground_truth: true
    log_period_s: 2.0

    # 图像话题。
    image_topic: /sim/camera/image_raw
    camera_info_topic: /sim/camera/camera_info
    # MuJoCo 查看器相机："fpv" 显示相机画面，"free" 显示第三人称环绕视角。
    # 窗口内按 V 切换；Esc 选自由视角，[ / ] 循环固定相机。
    viewer_camera: fpv
